name: DIPSAUS Europe recovery (shadow by default)
on:
  workflow_dispatch:
  # Schedule parked until live shadow runs and cost controls are verified.
  # schedule:
  #   - cron: '*/10 7-16 * * 1-5'
  #     timezone: Europe/Amsterdam
  #   - cron: '35 20 * * 1-5'
  #     timezone: Europe/Amsterdam
permissions:
  contents: read
concurrency:
  group: dipsaus-eu-runtime
  cancel-in-progress: false
jobs:
  scanner:
    if: github.repository == 'sheyna82/Dipsaus-public-scanner' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install tested pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run regression and migration safety tests
        run: python -m unittest discover -p 'test*.py'
      - name: Run scanner with private runtime data
        env:
          SCANNER_PRIVATE_CONFIG: ${{ secrets.SCANNER_PRIVATE_CONFIG }}
          SCANNER_STATE_REPOSITORY: ${{ secrets.SCANNER_STATE_REPOSITORY }}
          SCANNER_STATE_TOKEN: ${{ secrets.SCANNER_STATE_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python safe_runner.py eu
      # No report summaries, artifacts, caches, git commits or personal stdout.
