name: Research evidence integrity gate
on:
  push:
    branches:
      - research/integrated-evidence-20261106
    paths:
      - 'research/integrated_filter_evidence_gate.py'
      - 'research/test_integrated_filter_evidence_gate.py'
      - 'research/integrated_evidence_manifest.json'
      - 'research/test_integrated_evidence_manifest.py'
      - 'research/integrated_evidence_readiness.py'
      - 'research/test_integrated_evidence_readiness.py'
      - 'research/check_integrated_evidence_gate.py'
      - 'research/integrated_historical_reconciliation.py'
      - 'research/integrated_artifact_fetch.py'
      - 'research/test_integrated_artifact_configuration.py'
      - 'research/test_integrated_historical_reconciliation.py'
      - 'research/degiro_eligibility_research_20261106.json'
      - 'research/integrated_degiro_eligibility_gate.py'
      - 'research/test_integrated_degiro_eligibility_gate.py'
      - 'research/integrated_broker_candidate_screen.py'
      - 'research/test_integrated_broker_candidate_screen.py'
      - 'research/integrated_recovery_decision_boundary.py'
      - 'research/test_integrated_recovery_decision_boundary.py'
      - 'research/integrated_capital_day_comparison.py'
      - 'research/test_integrated_capital_day_comparison.py'
      - 'research/integrated_overlapping_capital_ledger.py'
      - 'research/test_integrated_overlapping_capital_ledger.py'
      - 'research/integrated_rejected_opportunity_attribution.py'
      - 'research/test_integrated_rejected_opportunity_attribution.py'
      - 'research/integrated_ex_ante_selection_comparison.py'
      - 'research/test_integrated_ex_ante_selection_comparison.py'
      - 'research/integrated_historical_priority_provenance.py'
      - 'research/test_integrated_historical_priority_provenance.py'
      - 'research/integrated_verified_priority_selection.py'
      - 'research/test_integrated_verified_priority_selection.py'
      - 'research/integrated_historical_source_bytes_gate.py'
      - 'research/test_integrated_historical_source_bytes_gate.py'
      - 'research/integrated_hash_checked_priority_selection.py'
      - 'research/test_integrated_hash_checked_priority_selection.py'
      - 'research/isolated_50000_portfolio_ledger.py'
      - 'research/test_isolated_50000_portfolio_ledger.py'
      - 'research/dipsaus_isolated_quality_gates.py'
      - 'research/test_dipsaus_isolated_quality_gates.py'
      - 'research/isolated_source_capture_audit.py'
      - 'research/test_isolated_source_capture_audit.py'
      - '.github/workflows/research-integrated-evidence.yml'
      - 'research/spoor2_mic_evidence_gate_20261113.py'
      - 'research/spoor2_xetra_artifact_retrieval_20261113.py'
      - 'research/spoor2_xetra_structure_inventory_20261113.py'
      - 'research/spoor2_xetra_market_segment_reference_20261113.py'
      - 'research/spoor2_xetra_pilot_evidence_20261113.py'
      - 'tests/test_spoor2_xetra_pilot_evidence_20261113.py'
      - 'tests/test_spoor2_xetra_artifact_retrieval_20261113.py'
      - 'tests/test_spoor2_mic_evidence_gate_20261113.py'
  pull_request:
    branches:
      - research/prospective-core-isolation-20261103
    paths:
      - 'research/**'
      - 'tests/test_spoor2_*.py'
      - '.github/workflows/research-integrated-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fail-closed integrity tests
        run: |
          python -m unittest discover -s research -p 'test_integrated_filter_evidence_gate.py' -v
          python -m unittest discover -s research -p 'test_integrated_evidence_manifest.py' -v
          python -m unittest discover -s research -p 'test_integrated_evidence_readiness.py' -v
          python research/check_integrated_evidence_gate.py
          python -m unittest discover -s research -p 'test_integrated_historical_reconciliation.py' -v
          python -m unittest discover -s research -p 'test_integrated_artifact_configuration.py' -v
          python -m unittest discover -s research -p 'test_integrated_degiro_eligibility_gate.py' -v
          python research/integrated_degiro_eligibility_gate.py
          python -m unittest discover -s research -p 'test_integrated_broker_candidate_screen.py' -v
          python -m unittest discover -s research -p 'test_integrated_recovery_decision_boundary.py' -v
          python -m unittest discover -s research -p 'test_integrated_capital_day_comparison.py' -v
          python -m unittest discover -s research -p 'test_integrated_overlapping_capital_ledger.py' -v
          python -m unittest discover -s research -p 'test_integrated_rejected_opportunity_attribution.py' -v
          python -m unittest discover -s research -p 'test_integrated_ex_ante_selection_comparison.py' -v
          python -m unittest discover -s research -p 'test_integrated_historical_priority_provenance.py' -v
          python -m unittest discover -s research -p 'test_integrated_verified_priority_selection.py' -v
          python -m unittest discover -s research -p 'test_integrated_historical_source_bytes_gate.py' -v
          python -m unittest discover -s research -p 'test_integrated_hash_checked_priority_selection.py' -v
          python -m unittest discover -s research -p 'test_isolated_50000_portfolio_ledger.py' -v
          python -m unittest discover -s research -p 'test_dipsaus_isolated_quality_gates.py' -v
          python -m unittest discover -s research -p 'test_isolated_source_capture_audit.py' -v

  spoor2-regression-auditable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install required cryptographic verifier
        run: python -m pip install "cryptography==44.0.3"
      - name: Run isolated Spoor 2 fail-closed regression
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python -m unittest discover -s tests -p 'test_spoor2_*.py' -v

  spoor2-xetra-source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Capture original Xetra bytes and inspect without attestation
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: |
          python - <<'PY'
          import json
          from research.spoor2_xetra_artifact_retrieval_20261113 import retrieve_xetra_artifact, public_metadata
          from research.spoor2_xetra_csv_intake_20261113 import inspect_xetra_csv
          from research.spoor2_xetra_zip_intake_20261113 import inspect_xetra_static_zip
          from research.spoor2_xetra_structure_inventory_20261113 import inventory_csv, inventory_zip, inspect_xetra_csv_schema
          from research.spoor2_xetra_market_segment_reference_20261113 import inspect_market_segment_reference
          from research.spoor2_xetra_pilot_evidence_20261113 import build_pilot_evidence

          pilot_bytes = {}
          for kind, inspector in (("csv", inspect_xetra_csv), ("zip", inspect_xetra_static_zip)):
              fetched = retrieve_xetra_artifact(kind)
              pilot_bytes[kind] = fetched["bytes"]
              inspected = inspector(fetched["bytes"]) if fetched["bytes"] is not None else None
              inventory = (inventory_csv(fetched["bytes"]) if kind == "csv" else inventory_zip(fetched["bytes"])) if fetched["bytes"] is not None else None
              schema = inspect_xetra_csv_schema(fetched["bytes"]) if kind == "csv" and fetched["bytes"] is not None else None
              segment_reference = inspect_market_segment_reference(fetched["bytes"]) if kind == "zip" and fetched["bytes"] is not None else None
              print(json.dumps({"artifact": kind, "retrieval": public_metadata(fetched),
                                "inspection": inspected, "inventory": inventory, "schema": schema, "segment_reference": segment_reference}, sort_keys=True))
          if pilot_bytes.get("csv") is not None and pilot_bytes.get("zip") is not None:
              print(json.dumps({"pilot_evidence": build_pilot_evidence(pilot_bytes["csv"], pilot_bytes["zip"])}, sort_keys=True))
          PY
