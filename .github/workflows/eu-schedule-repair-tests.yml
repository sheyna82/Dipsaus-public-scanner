name: EU schedule repair isolated tests
on:
  push:
    branches:
      - fix/eu-schedule-utc-session-gate-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate CET CEST weekend manual gate
        run: python -m unittest -v test_eu_schedule_gate.py
