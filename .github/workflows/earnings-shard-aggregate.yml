name: DIPSAUS earnings 20-shard aggregation
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Completed 20-shard earnings price linkage run ID'
        required: true
        default: '40569588031'
permissions:
  contents: read
  actions: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download all shard outputs from selected completed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.source_run_id }}
          pattern: earnings-price-shard-*
          path: earnings-shards
          merge-multiple: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail closed on incomplete or overlapping shards
        run: python research_earnings_shard_aggregate.py --root earnings-shards --output earnings-aggregate.json --require-shards 20
      - name: Upload aggregate report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: earnings-aggregate-unverified
          path: earnings-aggregate.json
          retention-days: 7
