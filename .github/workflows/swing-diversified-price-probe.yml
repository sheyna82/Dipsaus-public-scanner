name: DIPSAUS diversified sector historical price probe
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/swing-diversified-price-probe.yml'
      - 'research_swing_diversified_universe.py'
      - 'research_swing_intratrade_excursion.py'
      - 'test_research_swing_intratrade_excursion.py'
      - 'research_swing_portfolio_proxy.py'
      - 'test_research_swing_portfolio_proxy.py'
      - 'research_swing_exit_policy_ab.py'
      - 'test_research_swing_exit_policy_ab.py'
      - 'research_swing_warning_component_ablation.py'
      - 'test_research_swing_warning_component_ablation.py'
      - 'research_swing_failure_warning_evaluation.py'
      - 'test_research_swing_failure_warning_evaluation.py'
      - 'research_swing_failure_warning.py'
      - 'test_research_swing_failure_warning.py'
      - 'research_swing_individual_risk.py'
      - 'test_research_swing_individual_risk.py'
      - 'research_swing_regime_archive_ab.py'
      - 'research_swing_short_regime_gate.py'
permissions:
  contents: read
jobs:
  diversified-price-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Retrieve and audit all predefined tickers
        run: |
          python - <<'PY'
          import json, time, urllib.request, urllib.error
          from pathlib import Path
          from research_swing_diversified_universe import universe_manifest,audit_coverage
          manifest=universe_manifest()
          symbols=[x["symbol"] for x in manifest["symbols"]]+manifest["benchmarks"]
          root=Path("diversified-price-probe")
          root.mkdir(exist_ok=True)
          statuses={}
          summary=[]
          for symbol in symbols:
              url=f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?range=5y&interval=1d"
              record={"symbol":symbol,"source":"yahoo_chart","source_authenticated_independently":False,"trade_ready":False}
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 DIPSAUS-research/1.0"})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      raw=response.read(2500000)
                  data=json.loads(raw)
                  item=data["chart"]["result"][0]
                  q=item["indicators"]["quote"][0]
                  dates=item["timestamp"]
                  rows=[{"timestamp":ts,"open":o,"high":h,"low":l,"close":c,"volume":v}
                        for ts,o,h,l,c,v in zip(dates,q["open"],q["high"],q["low"],q["close"],q["volume"])
                        if None not in (o,h,l,c) and o>0 and h>0 and l>0 and c>0 and l<=min(o,c) and h>=max(o,c)]
                  if len(rows)<200:
                      raise ValueError("insufficient_valid_ohlcv")
                  (root/(symbol+".json")).write_text(json.dumps({"symbol":symbol,"rows":rows}))
                  record.update(status="normalized_unverified",observations=len(rows),first_timestamp=rows[0]["timestamp"],last_timestamp=rows[-1]["timestamp"])
              except Exception as exc:
                  record.update(status="unavailable",error_type=type(exc).__name__,error=str(exc)[:160])
              statuses[symbol]=record["status"]
              summary.append(record)
              print(json.dumps(record),flush=True)
              time.sleep(0.15)
          coverage=audit_coverage(statuses)
          (root/"coverage.json").write_text(json.dumps({"manifest":manifest,"coverage":coverage,"results":summary},indent=2))
          print("COVERAGE",json.dumps({"available":coverage["available"],"unavailable":coverage["unavailable"]}))
          PY
      - name: Historical regime A/B comparison (only if dates align)
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          from research_swing_regime_archive_ab import run_regime_ab_archive
          root=Path('diversified-price-probe')
          archive=Path('diversified-sector-prices.zip')
          with zipfile.ZipFile(archive,'w') as z:
              for p in root.glob('*.json'):
                  z.write(p,p.name)
          try:
              result=run_regime_ab_archive(archive)
          except (ValueError, KeyError, FileNotFoundError, zipfile.BadZipFile) as exc:
              result={'research_only':True,'trade_ready':False,'status':'blocked',
                      'reason':type(exc).__name__+': '+str(exc)[:240]}
          (root/'regime-ab-results.json').write_text(json.dumps(result,indent=2))
          print('REGIME_AB',json.dumps({'status':result.get('status','computed'),
              'summary':result.get('summary'),'reason':result.get('reason')}))
          PY
      - name: Evaluate warning signals on historical price panel
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          from research_swing_failure_warning_evaluation import evaluate_failure_warnings
          root=Path('diversified-price-probe')
          try:
              coverage=json.loads((root/'coverage.json').read_text())
              symbols=[x['symbol'] for x in coverage['manifest']['symbols']]
              bars={s:json.loads((root/(s+'.json')).read_text())['rows'] for s in symbols}
              summary=[evaluate_failure_warnings(bars,horizon=h,step=15) for h in (5,10,15)]
              result={'status':'computed','summary':summary,'research_only':True,'trade_ready':False}
          except (ValueError,KeyError,FileNotFoundError) as exc:
              result={'status':'blocked','reason':type(exc).__name__+': '+str(exc)[:240],'research_only':True}
          (root/'warning-evaluation.json').write_text(json.dumps(result,indent=2))
          print('WARNING_EVAL',json.dumps(result))
          PY
      - name: Compare individual warning components
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_swing_warning_component_ablation import evaluate_warning_components
          root=Path('diversified-price-probe')
          try:
              coverage=json.loads((root/'coverage.json').read_text())
              symbols=[x['symbol'] for x in coverage['manifest']['symbols']]
              bars={s:json.loads((root/(s+'.json')).read_text())['rows'] for s in symbols}
              result={'status':'computed','summary':[evaluate_warning_components(bars,horizon=h,step=15) for h in (5,10,15)]}
          except (ValueError,KeyError,FileNotFoundError) as exc:
              result={'status':'blocked','reason':type(exc).__name__+': '+str(exc)[:240]}
          result.update(research_only=True,trade_ready=False)
          (root/'warning-components.json').write_text(json.dumps(result,indent=2))
          print('WARNING_COMPONENTS',json.dumps(result))
          PY
      - name: Compare realistic next-open exit policies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_swing_exit_policy_ab import compare_exit_policies
          root=Path('diversified-price-probe')
          try:
              coverage=json.loads((root/'coverage.json').read_text())
              symbols=[x['symbol'] for x in coverage['manifest']['symbols']]
              bars={s:json.loads((root/(s+'.json')).read_text())['rows'] for s in symbols}
              result={'status':'computed','cost_scenarios_bps':{str(cost):[compare_exit_policies(bars,horizon=h,step=15,round_trip_cost_bps=cost) for h in (5,10,15)] for cost in (10,30,60)}}
          except (ValueError,KeyError,FileNotFoundError) as exc:
              result={'status':'blocked','reason':type(exc).__name__+': '+str(exc)[:240]}
          result.update(research_only=True,trade_ready=False)
          (root/'exit-policy-ab.json').write_text(json.dumps(result,indent=2))
          print('EXIT_POLICY_AB',json.dumps(result))
          PY
      - name: Compare six-slot portfolio proxies
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_swing_portfolio_proxy import portfolio_swing_proxy
          root=Path('diversified-price-probe')
          try:
              coverage=json.loads((root/'coverage.json').read_text())
              symbols=[x['symbol'] for x in coverage['manifest']['symbols']]
              bars={s:json.loads((root/(s+'.json')).read_text())['rows'] for s in symbols}
              benchmark_rows=json.loads((root/'SPY.json').read_text())['rows']
              if tuple(x['timestamp'] for x in benchmark_rows)!=tuple(x['timestamp'] for x in next(iter(bars.values()))):
                  raise ValueError('unaligned_benchmark')
              benchmark_net_pct=round(100*(benchmark_rows[-1]['close']/benchmark_rows[20]['open']-1)-.3,4)
              result={'status':'computed','benchmark':{'symbol':'SPY','buy_hold_net_pct':benchmark_net_pct,'cost_assumption_bps':30,'dividends_modelled':False},'comparisons':[
                  {'horizon':h,'warning_exits':w,'exposure_cap':cap,
                   **portfolio_swing_proxy(bars,horizon=h,warning_exits=w,max_exposure_fraction=cap)}
                  for h in (5,10,15) for w in (False,True) for cap in (.5,.75,1.0)]}
          except (ValueError,KeyError,FileNotFoundError) as exc:
              result={'status':'blocked','reason':type(exc).__name__+': '+str(exc)[:240]}
          result.update(research_only=True,trade_ready=False)
          (root/'portfolio-proxy.json').write_text(json.dumps(result,indent=2))
          print('PORTFOLIO_PROXY',json.dumps(result))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dipsaus-diversified-sector-prices-unverified
          path: diversified-price-probe/
          retention-days: 7
          if-no-files-found: error
