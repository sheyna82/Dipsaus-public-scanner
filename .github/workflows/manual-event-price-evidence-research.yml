name: DIPSAUS manual event price evidence (research only)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Historical start date (YYYY-MM-DD)"
        required: true
        default: "2026-10-01"
      end:
        description: "Historical end date (YYYY-MM-DD; no future dates)"
        required: true
        default: "2026-10-23"

permissions:
  contents: read

jobs:
  download-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Acquire public historical daily CSV only
        env:
          START_DATE: ${{ inputs.start }}
          END_DATE: ${{ inputs.end }}
        run: |
          python -m py_compile research_event_stooq_acquisition.py research_event_download_cli.py
          python research_event_download_cli.py --start "$START_DATE" --end "$END_DATE" --allow-network --output research-event-history
      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: event-historical-vendor-evidence
          path: research-event-history/
          if-no-files-found: warn
          retention-days: 7
