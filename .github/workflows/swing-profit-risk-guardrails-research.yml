name: DIPSAUS swing profit risk guardrail research tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research_swing_profit_risk_guardrails.py'
      - 'test_research_swing_profit_risk_guardrails.py'
      - 'research_swing_equity_risk.py'
      - '.github/workflows/swing-profit-risk-guardrails-research.yml'

permissions:
  contents: read

jobs:
  synthetic-profit-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test predeclared profit and risk limits
        run: python -m unittest -v test_research_swing_profit_risk_guardrails
