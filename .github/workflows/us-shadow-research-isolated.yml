name: US shadow research isolated tests
on:
  push:
    branches:
      - research/us-shadow-isolated-20261117
    paths:
      - 'research/us_*_20261117.py'
      - 'research/us_*_20261118.py'
      - 'research/eu_selection_gate_attribution_20261118.py'
      - 'research/eu_selection_money_sensitivity_20261118.py'
      - 'tests/test_us_*_20261117.py'
      - 'tests/test_us_*_20261118.py'
      - 'tests/test_eu_selection_gate_attribution_20261118.py'
      - 'tests/test_eu_selection_money_sensitivity_20261118.py'
      - '.github/workflows/us-shadow-research-isolated.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-us-shadow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline fail-closed unit tests
        run: |
          python -m unittest discover -s tests -p 'test_us_*_20261117.py' -v
          python -m unittest discover -s tests -p 'test_us_*_20261118.py' -v
          python -m unittest discover -s tests -p 'test_eu_selection_gate_attribution_20261118.py' -v
          python -m unittest discover -s tests -p 'test_eu_selection_money_sensitivity_20261118.py' -v
