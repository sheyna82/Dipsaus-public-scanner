name: DIPSAUS company-event regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'company_event_watch.py'
      - 'safe_runner.py'
      - 'silent_macro_context.py'
      - 'macro_market_confirmation.py'
      - 'macro_index_quotes.py'
      - 'test_silent_macro_context.py'
      - 'test_macro_market_confirmation.py'
      - 'event_opportunity_engine.py'
      - 'test_event_opportunity_engine.py'
      - 'test_company_event_watch.py'
      - '.github/workflows/test-company-events.yml'
permissions:
  contents: read
jobs:
  event-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install tested pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Compile event code
        run: python -m py_compile company_event_watch.py test_company_event_watch.py event_opportunity_engine.py test_event_opportunity_engine.py silent_macro_context.py test_silent_macro_context.py macro_market_confirmation.py test_macro_market_confirmation.py macro_index_quotes.py
      - name: Test entire scanner regression suite without secrets or push delivery
        run: python -m unittest discover -p 'test*.py'
