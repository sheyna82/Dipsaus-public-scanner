name: DIPSAUS company-event regression
on:
  workflow_dispatch:
  push:
    paths:
      - 'company_event_watch.py'
      - 'test_company_event_watch.py'
      - '.github/workflows/test-company-events.yml'
permissions:
  contents: read
jobs:
  event-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile event code
        run: python -m py_compile company_event_watch.py test_company_event_watch.py
      - name: Test event calendar and deduplication without secrets or push delivery
        run: python -m unittest -v test_company_event_watch.py
