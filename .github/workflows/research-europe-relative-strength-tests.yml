name: EU relative strength offline gate tests
on:
  pull_request:
    paths:
      - 'research_europe_relative_strength.py'
      - 'test_research_europe_relative_strength.py'
      - '.github/workflows/research-europe-relative-strength-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_research_europe_relative_strength.py
