name: DIPSAUS dynamic swing exit research tests
on:
  pull_request:
    paths:
      - 'research_swing_dynamic_exit_comparison.py'
      - 'test_research_swing_dynamic_exit_comparison.py'
      - '.github/workflows/swing-dynamic-exit-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dynamic-exit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run deterministic offline research tests
        run: python -m unittest -v test_research_swing_dynamic_exit_comparison
