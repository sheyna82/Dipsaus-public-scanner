name: Validate sanitized scanner (no secrets or notifications)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dipsaus-migration-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'sheyna82/Dipsaus-public-scanner' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test scanner and migration privacy guards
        run: python -m unittest discover -p 'test*.py'
      - name: Check public tree excludes private runtime
        run: |
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','ls-files'], text=True).splitlines()
          forbidden = ('config/', 'reports/', '.env', 'migration_runtime/')
          assert not any(p.startswith(forbidden) for p in files), 'Private runtime path tracked'
          print('Public source has no tracked private runtime paths.')
          PY
