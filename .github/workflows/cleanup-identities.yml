name: Remove personal commit identities
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    if: github.repository == 'sheyna82/Dipsaus-public-scanner' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Rewrite commit identities and verify unchanged source
        env:
          FILTER_BRANCH_SQUELCH_WARNING: '1'
        run: |
          set -eu
          original=$(git rev-parse HEAD)
          tree=$(git rev-parse HEAD^{tree})
          git checkout -B main "$original"
          git filter-branch --force --env-filter '
            export GIT_AUTHOR_NAME="sheyna82"
            export GIT_COMMITTER_NAME="sheyna82"
            export GIT_AUTHOR_EMAIL="332179545+sheyna82@users.noreply.github.com"
            export GIT_COMMITTER_EMAIL="332179545+sheyna82@users.noreply.github.com"
          ' -- main >/dev/null 2>&1
          test "$(git rev-parse HEAD^{tree})" = "$tree"
          python - <<'PY'
          import subprocess
          rows = subprocess.check_output(["git","log","main","--format=%ae%n%ce"],text=True).splitlines()
          assert rows and all(x == "332179545+sheyna82@users.noreply.github.com" for x in rows)
          print("All reachable main commit identities are anonymous; source tree unchanged.")
          PY
          git push origin main --force-with-lease="refs/heads/main:$original"
