name: DIPSAUS diversified sector universe tests
on:
  pull_request:
    paths:
      - 'research_swing_diversified_universe.py'
      - 'test_research_swing_diversified_universe.py'
      - '.github/workflows/swing-diversified-universe-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diversified-universe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_research_swing_diversified_universe
