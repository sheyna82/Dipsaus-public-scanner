name: DIPSAUS pull request regression
on:
  pull_request:
    paths:
      - 'safe_runner.py'
      - 'test_migration_safety.py'
      - '.github/workflows/pr-regression.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run offline regression tests
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python -m unittest discover -p 'test*.py'
