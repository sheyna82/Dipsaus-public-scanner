name: DIPSAUS pull request regression
on:
  pull_request:
    paths:
      - 'research/candidate_entry_snapshot.py'
      - 'research/test_candidate_entry_snapshot.py'
      - 'safe_runner.py'
      - 'us_recovery_pilot.py'
      - 'test_us_recovery_pilot.py'
      - 'dipsaus_eu_freshness.py'
      - 'dipsaus_eu_session_context.py'
      - 'test_dipsaus_eu_session_context.py'
      - 'test_dipsaus_eu_freshness.py'
      - 'dipsaus_fx_source.py'
      - 'test_dipsaus_fx_source.py'
      - 'dipsaus_eur_upside_audit.py'
      - 'test_dipsaus_eur_upside_audit.py'
      - 'dipsaus_eur_upside.py'
      - 'test_dipsaus_eur_upside.py'
      - 'dipsaus_research_evidence.py'
      - 'dipsaus_unified_research.py'
      - 'test_dipsaus_research_evidence.py'
      - 'private_notifications.py'
      - 'dipsaus_breakout_distance.py'
      - 'test_dipsaus_breakout_distance.py'
      - 'test_migration_safety.py'
      - '.github/workflows/pr-regression.yml'
      - '.github/workflows/shadow-prealert.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run offline regression tests
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python -m unittest discover -p 'test*.py'

      - name: Run six-candidate offline safety tests
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python -m unittest discover -s research -p 'test_candidate_entry_snapshot.py' -v
