name: DIPSAUS pull request regression
on:
  pull_request:
    paths:
      - 'research/candidate_regime_cost_validation.py'
      - 'research/test_candidate_regime_cost_validation.py'
      - 'research/candidate_nonoverlap_validation.py'
      - 'research/candidate_conditional_cohorts.py'
      - 'research/test_candidate_conditional_cohorts.py'
      - 'research/candidate_entry_snapshot.py'
      - 'research/test_candidate_entry_snapshot.py'
      - 'safe_runner.py'
      - 'us_recovery_pilot.py'
      - 'test_us_recovery_pilot.py'
      - 'dipsaus_eu_freshness.py'
      - 'dipsaus_eu_session_context.py'
      - 'test_dipsaus_eu_session_context.py'
      - 'test_dipsaus_eu_freshness.py'
      - 'dipsaus_fx_source.py'
      - 'test_dipsaus_fx_source.py'
      - 'dipsaus_eur_upside_audit.py'
      - 'test_dipsaus_eur_upside_audit.py'
      - 'dipsaus_eur_upside.py'
      - 'test_dipsaus_eur_upside.py'
      - 'dipsaus_research_evidence.py'
      - 'dipsaus_unified_research.py'
      - 'test_dipsaus_research_evidence.py'
      - 'private_notifications.py'
      - 'dipsaus_breakout_distance.py'
      - 'test_dipsaus_breakout_distance.py'
      - 'test_migration_safety.py'
      - '.github/workflows/pr-regression.yml'
      - '.github/workflows/shadow-prealert.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run offline regression tests
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python -m unittest discover -p 'test*.py'

      - name: Calculate six-candidate daily market snapshot
        if: github.head_ref == 'research/offline-technical-risk-20261021'
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python research/candidate_entry_snapshot.py
      - name: Calculate conditional recovery cohorts
        if: github.head_ref == 'research/offline-technical-risk-20261021'
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python research/candidate_conditional_cohorts.py
      - name: Calculate non-overlapping candidate validation
        if: github.head_ref == 'research/offline-technical-risk-20261021'
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python research/candidate_nonoverlap_validation.py
      - name: Calculate regime-matched cost sensitivity
        if: github.head_ref == 'research/offline-technical-risk-20261021'
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python research/candidate_regime_cost_validation.py
      - name: Upload regime-matched cost sensitivity
        if: github.head_ref == 'research/offline-technical-risk-20261021'
        uses: actions/upload-artifact@v4
        with:
          name: six-candidate-regime-cost-validation
          path: reports/candidate_regime_cost_validation.json
          if-no-files-found: error
      - name: Upload non-overlapping candidate validation
        if: github.head_ref == 'research/offline-technical-risk-20261021'
        uses: actions/upload-artifact@v4
        with:
          name: six-candidate-nonoverlap-validation
          path: reports/candidate_nonoverlap_validation.json
          if-no-files-found: error
      - name: Upload conditional recovery cohorts
        if: github.head_ref == 'research/offline-technical-risk-20261021'
        uses: actions/upload-artifact@v4
        with:
          name: six-candidate-conditional-cohorts
          path: reports/candidate_conditional_cohorts.json
          if-no-files-found: error
      - name: Upload six-candidate market snapshot
        if: github.head_ref == 'research/offline-technical-risk-20261021'
        uses: actions/upload-artifact@v4
        with:
          name: six-candidate-market-snapshot
          path: reports/candidate_entry_research.json
          if-no-files-found: error
      - name: Run six-candidate offline safety tests
        if: always()
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python -m unittest discover -s research -p 'test_candidate_entry_snapshot.py' -v

      - name: Test conditional cohorts offline
        if: always()
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python -m unittest discover -s research -p 'test_candidate_conditional_cohorts.py' -v

      - name: Test regime-matched cost controls offline
        if: always()
        env:
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python -m unittest discover -s research -p 'test_candidate_regime_cost_validation.py' -v
