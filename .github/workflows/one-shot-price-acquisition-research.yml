name: DIPSAUS one-shot public price acquisition experiment

on:
  pull_request:
    paths:
      - '.github/workflows/one-shot-price-acquisition-research.yml'

permissions:
  contents: read

jobs:
  public-price-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe one public Stooq historical series (no credentials)
        shell: bash
        run: |
          mkdir -p research-price-probe
          python - <<'PY'
          import json
          from pathlib import Path
          from research_event_stooq_acquisition import acquire_stooq_history
          outcome = {"source": "stooq", "symbol": "AMD", "start": "2026-10-01",
                     "end": "2026-10-23", "trade_ready": False}
          try:
              metadata = acquire_stooq_history(
                  "AMD", "2026-10-01", "2026-10-23",
                  "research-price-probe", allow_network=True)
              outcome.update(status="downloaded_unverified",
                             observations=metadata["row_count"],
                             sha256=metadata["content_sha256"])
          except Exception as exc:
              outcome.update(status="unavailable", error_type=type(exc).__name__,
                             error=str(exc)[:160])
          Path("research-price-probe/result.json").write_text(
              json.dumps(outcome, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(outcome))
          if outcome["status"] != "downloaded_unverified":
              print("RESEARCH DATA NOT ACQUIRED: workflow job succeeded only as diagnostic")
          PY
      - name: Probe official unauthenticated provider endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          targets = {
              "twelve_data": "https://api.twelvedata.com/time_series?symbol=AMD&interval=1day&outputsize=5",
              "alpha_vantage": "https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=AMD",
              "tiingo": "https://api.tiingo.com/tiingo/daily/amd/prices?startDate=2026-10-01&endDate=2026-10-23",
              "yahoo_chart": "https://query1.finance.yahoo.com/v8/finance/chart/AMD?range=1y&interval=1d",
          }
          results = []
          for name, url in targets.items():
              record = {"provider": name, "symbol": "AMD", "credentials_supplied": False,
                        "historical_data_validated": False, "trade_ready": False}
              try:
                  req = Request(url, headers={"User-Agent": "DIPSAUS-research-probe/1.0"})
                  with urlopen(req, timeout=8) as response:
                      record["http_status"] = response.status
                      sample = response.read(262145)
                      record["bytes_sampled"] = len(sample)
                      if len(sample) > 262144:
                          record["payload_class"] = "response_too_large"
                          record["outcome"] = "unvalidated_size_limit"
                          results.append(record)
                          print(json.dumps(record))
                          continue
                      record["outcome"] = "response_received_not_validated"
                      try:
                          body = json.loads(sample)
                          if isinstance(body, dict):
                              keys = set(body)
                              if name == "yahoo_chart" and isinstance(body.get("chart"), dict):
                                  chart = body["chart"]
                                  if isinstance(chart.get("result"), list) and chart["result"]:
                                      record["payload_class"] = "chart_result_unverified"
                                  else:
                                      record["payload_class"] = "chart_error_or_empty"
                              elif "Time Series (Daily)" in keys:
                                  record["payload_class"] = "daily_series_unverified"
                              elif keys & {"Error Message", "Note", "Information"}:
                                  record["payload_class"] = "vendor_message_not_prices"
                              elif body.get("status") == "error":
                                  record["payload_class"] = "vendor_error_not_prices"
                              else:
                                  record["payload_class"] = "unrecognized_json"
                          elif isinstance(body, list):
                              record["payload_class"] = "json_list_unverified"
                          else:
                              record["payload_class"] = "unexpected_json"
                      except (ValueError, UnicodeDecodeError):
                          record["payload_class"] = "non_json_response"
              except HTTPError as exc:
                  record.update(http_status=exc.code, outcome="http_error")
              except (URLError, TimeoutError, OSError) as exc:
                  record.update(outcome="network_error", error_type=type(exc).__name__)
              results.append(record)
              print(json.dumps(record))
          Path("research-price-probe/provider-access.json").write_text(
              json.dumps(results, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Acquire and validate actual Yahoo AMD daily observations
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from research_yahoo_chart_daily import parse_yahoo_chart_daily
          root = Path("research-price-probe")
          symbols = ("TSLA", "META", "COHU", "AMZN", "PLTR", "AMD", "SPY")
          results = []
          for symbol in symbols:
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?range=1y&interval=1d"
              outcome = {"provider": "yahoo_chart", "symbol": symbol,
                         "trade_ready": False, "source_authenticated_independently": False}
              try:
                  with urlopen(Request(url, headers={"User-Agent": "DIPSAUS-research-probe/1.0"}), timeout=12) as response:
                      if response.geturl().split("/")[2] != "query1.finance.yahoo.com":
                          raise ValueError("unexpected_redirect")
                      raw = response.read(262145)
                  if len(raw) > 262144:
                      raise ValueError("payload_too_large")
                  rows = parse_yahoo_chart_daily(json.loads(raw), expected_symbol=symbol)
                  digest = hashlib.sha256(raw).hexdigest()
                  (root / f"yahoo-{symbol}-raw.json").write_bytes(raw)
                  (root / f"yahoo-{symbol}-normalized.json").write_text(
                      json.dumps(rows, indent=2) + "\n", encoding="utf-8")
                  outcome.update(status="normalized_unverified", observations=len(rows),
                                 first_date=rows[0]["date"], last_date=rows[-1]["date"],
                                 raw_sha256=digest, retrieved_at_utc=datetime.now(timezone.utc).isoformat())
              except Exception as exc:
                  outcome.update(status="failed", error_type=type(exc).__name__, error=str(exc)[:180])
              (root / f"yahoo-{symbol}-validation.json").write_text(
                  json.dumps(outcome, indent=2) + "\n", encoding="utf-8")
              results.append(outcome)
              print(json.dumps(outcome))
          (root / "yahoo-cohort-summary.json").write_text(
              json.dumps(results, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Compare observed seven-symbol returns against SPY
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from decimal import Decimal
          root = Path("research-price-probe")
          symbols = ("TSLA", "META", "COHU", "AMZN", "PLTR", "AMD")
          report = {"status": "descriptive_only", "predictive_skill_established": False,
                    "independently_verified": False, "trade_ready": False, "comparisons": []}
          try:
              data = {}
              for symbol in (*symbols, "SPY"):
                  data[symbol] = json.loads((root / f"yahoo-{symbol}-normalized.json").read_text())
              dates = sorted(set.intersection(*(set(row["date"] for row in series) for series in data.values())))
              if len(dates) < 6:
                  raise ValueError("fewer_than_six_shared_sessions")
              by_symbol = {symbol: {row["date"]: Decimal(row["close"]) for row in rows}
                           for symbol, rows in data.items()}
              first, last = dates[0], dates[-1]
              for symbol in symbols:
                  stock = by_symbol[symbol]
                  spy = by_symbol["SPY"]
                  stock_return = (stock[last] / stock[first] - 1) * 100
                  spy_return = (spy[last] / spy[first] - 1) * 100
                  report["comparisons"].append({
                      "symbol": symbol, "first_session": first, "last_session": last,
                      "shared_sessions": len(dates),
                      "stock_return_pct": str(stock_return),
                      "spy_return_pct": str(spy_return),
                      "excess_percentage_points": str(stock_return - spy_return)})
              report["status"] = "computed_unverified"
          except Exception as exc:
              report.update(status="unavailable", error_type=type(exc).__name__, error=str(exc)[:180])
          (root / "yahoo-cohort-vs-spy.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          if report["status"] != "computed_unverified":
              raise SystemExit("descriptive_comparison_failed")
          PY
      - name: Calculate observed rolling forward excess returns
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_rolling_excess_returns import rolling_excess_returns
          root = Path("research-price-probe")
          symbols = ("TSLA", "META", "COHU", "AMZN", "PLTR", "AMD")
          spy = json.loads((root / "yahoo-SPY-normalized.json").read_text())
          summary = {"status": "descriptive_only", "predictive_skill_established": False,
                     "independently_verified": False, "trade_ready": False, "symbols": {}}
          for symbol in symbols:
              stock = json.loads((root / f"yahoo-{symbol}-normalized.json").read_text())
              result = rolling_excess_returns(stock, spy)
              summary["symbols"][symbol] = {
                  "observations": len(result["observations"]),
                  "horizons": [1, 3, 5]}
              (root / f"yahoo-{symbol}-rolling-excess.json").write_text(
                  json.dumps(result, indent=2) + "\n")
          (root / "yahoo-rolling-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary))
          PY
      - name: Evaluate simple past-return signal on observed data
        shell: bash
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          from research_past_return_signal_baseline import evaluate_past_return_signal
          root = Path("research-price-probe")
          spy = json.loads((root / "yahoo-SPY-normalized.json").read_text())
          report = {"baseline": "past_relative_momentum", "lookback": 3, "horizon": 3,
                    "in_sample_only": True, "predictive_skill_established": False,
                    "trade_ready": False, "results": []}
          for symbol in ("TSLA", "META", "COHU", "AMZN", "PLTR", "AMD"):
              stock = json.loads((root / f"yahoo-{symbol}-normalized.json").read_text())
              evaluation = evaluate_past_return_signal(stock, spy, lookback=3, horizon=3)
              rows = evaluation["observations"]
              positive = [row for row in rows if row["signal_positive_past_excess"]]
              negative = [row for row in rows if not row["signal_positive_past_excess"]]
              def mean(group):
                  if not group:
                      return None
                  return str(sum(Decimal(row["future_excess_percentage_points"]) for row in group) / len(group))
              report["results"].append({
                  "symbol": symbol, "observations": len(rows),
                  "positive_signals": len(positive), "negative_signals": len(negative),
                  "mean_future_excess_positive_pp": mean(positive),
                  "mean_future_excess_negative_pp": mean(negative)})
          (root / "yahoo-momentum-baseline.json").write_text(
              json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
      - name: Check nonoverlapping momentum outcome windows
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_nonoverlapping_momentum import nonoverlapping_momentum_summary
          root = Path("research-price-probe")
          spy = json.loads((root / "yahoo-SPY-normalized.json").read_text())
          report = {"method": "nonoverlapping_momentum", "in_sample_only": True,
                    "predictive_skill_established": False, "trade_ready": False, "results": []}
          for symbol in ("TSLA", "META", "COHU", "AMZN", "PLTR", "AMD"):
              stock = json.loads((root / f"yahoo-{symbol}-normalized.json").read_text())
              result = nonoverlapping_momentum_summary(stock, spy)
              report["results"].append({"symbol": symbol, **result})
          (root / "yahoo-nonoverlapping-momentum.json").write_text(
              json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
      - name: Test chronological holdout research module
        run: python -m unittest -v test_research_chronological_momentum_holdout
      - name: Evaluate chronological momentum holdout on observed prices
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_chronological_momentum_holdout import chronological_momentum_holdout
          root = Path("research-price-probe")
          spy = json.loads((root / "yahoo-SPY-normalized.json").read_text())
          report = {"research_only": True, "independently_verified": False,
                    "predictive_skill_established": False, "trade_ready": False,
                    "results": []}
          for symbol in ("TSLA", "META", "COHU", "AMZN", "PLTR", "AMD"):
              stock = json.loads((root / f"yahoo-{symbol}-normalized.json").read_text())
              result = chronological_momentum_holdout(stock, spy)
              report["results"].append({"symbol": symbol, **result})
          (root / "yahoo-chronological-momentum-holdout.json").write_text(
              json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
      - name: Test forward downside research module
        run: python -m unittest -v test_research_momentum_forward_downside
      - name: Evaluate forward downside of momentum cohorts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_momentum_forward_downside import momentum_forward_downside
          root = Path("research-price-probe")
          spy = json.loads((root / "yahoo-SPY-normalized.json").read_text())
          report = {"research_only": True, "independently_verified": False,
                    "predictive_skill_established": False, "trade_ready": False,
                    "results": []}
          for symbol in ("TSLA", "META", "COHU", "AMZN", "PLTR", "AMD"):
              stock = json.loads((root / f"yahoo-{symbol}-normalized.json").read_text())
              result = momentum_forward_downside(stock, spy)
              report["results"].append({"symbol": symbol,
                                        "positive": result["positive"],
                                        "negative": result["negative"]})
          (root / "yahoo-momentum-forward-downside.json").write_text(
              json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
      - name: Evaluate chronological forward downside cohorts
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_momentum_forward_downside import chronological_forward_downside
          root = Path("research-price-probe")
          spy = json.loads((root / "yahoo-SPY-normalized.json").read_text())
          report = {"research_only": True, "independently_verified": False,
                    "predictive_skill_established": False, "trade_ready": False,
                    "results": []}
          for symbol in ("TSLA", "META", "COHU", "AMZN", "PLTR", "AMD"):
              stock = json.loads((root / f"yahoo-{symbol}-normalized.json").read_text())
              report["results"].append({"symbol": symbol,
                                        **chronological_forward_downside(stock, spy)})
          (root / "yahoo-chronological-forward-downside.json").write_text(
              json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
      - name: Test conservative downside evidence gate
        run: python -m unittest -v test_research_downside_evidence_gate
      - name: Evaluate downside evidence sufficiency
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_downside_evidence_gate import downside_evidence_gate
          root = Path("research-price-probe")
          spy = json.loads((root / "yahoo-SPY-normalized.json").read_text())
          report = {"research_only": True, "predictive_skill_established": False,
                    "trade_ready": False, "results": []}
          for symbol in ("TSLA", "META", "COHU", "AMZN", "PLTR", "AMD"):
              stock = json.loads((root / f"yahoo-{symbol}-normalized.json").read_text())
              report["results"].append({"symbol": symbol, **downside_evidence_gate(stock, spy)})
          (root / "yahoo-downside-evidence-gate.json").write_text(
              json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dipsaus-one-shot-price-probe
          path: research-price-probe/
          if-no-files-found: warn
          retention-days: 7
