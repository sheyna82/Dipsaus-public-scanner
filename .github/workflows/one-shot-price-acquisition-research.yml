name: DIPSAUS one-shot public price acquisition experiment

on:
  pull_request:
    paths:
      - '.github/workflows/one-shot-price-acquisition-research.yml'

permissions:
  contents: read

jobs:
  public-price-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe one public Stooq historical series (no credentials)
        shell: bash
        run: |
          mkdir -p research-price-probe
          python - <<'PY'
          import json
          from pathlib import Path
          from research_event_stooq_acquisition import acquire_stooq_history
          outcome = {"source": "stooq", "symbol": "AMD", "start": "2026-10-01",
                     "end": "2026-10-23", "trade_ready": False}
          try:
              metadata = acquire_stooq_history(
                  "AMD", "2026-10-01", "2026-10-23",
                  "research-price-probe", allow_network=True)
              outcome.update(status="downloaded_unverified",
                             observations=metadata["row_count"],
                             sha256=metadata["content_sha256"])
          except Exception as exc:
              outcome.update(status="unavailable", error_type=type(exc).__name__,
                             error=str(exc)[:160])
          Path("research-price-probe/result.json").write_text(
              json.dumps(outcome, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(outcome))
          if outcome["status"] != "downloaded_unverified":
              print("RESEARCH DATA NOT ACQUIRED: workflow job succeeded only as diagnostic")
          PY
      - name: Probe official unauthenticated provider endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          targets = {
              "twelve_data": "https://api.twelvedata.com/time_series?symbol=AMD&interval=1day&outputsize=5",
              "alpha_vantage": "https://www.alphavantage.co/query?function=TIME_SERIES_DAILY&symbol=AMD",
              "tiingo": "https://api.tiingo.com/tiingo/daily/amd/prices?startDate=2026-10-01&endDate=2026-10-23",
              "yahoo_chart": "https://query1.finance.yahoo.com/v8/finance/chart/AMD?range=1mo&interval=1d",
          }
          results = []
          for name, url in targets.items():
              record = {"provider": name, "symbol": "AMD", "credentials_supplied": False,
                        "historical_data_validated": False, "trade_ready": False}
              try:
                  req = Request(url, headers={"User-Agent": "DIPSAUS-research-probe/1.0"})
                  with urlopen(req, timeout=8) as response:
                      record["http_status"] = response.status
                      sample = response.read(2048)
                      record["bytes_sampled"] = len(sample)
                      record["outcome"] = "response_received_not_validated"
                      try:
                          body = json.loads(sample)
                          if isinstance(body, dict):
                              keys = set(body)
                              if name == "yahoo_chart" and isinstance(body.get("chart"), dict):
                                  chart = body["chart"]
                                  if isinstance(chart.get("result"), list) and chart["result"]:
                                      record["payload_class"] = "chart_result_unverified"
                                  else:
                                      record["payload_class"] = "chart_error_or_empty"
                              elif "Time Series (Daily)" in keys:
                                  record["payload_class"] = "daily_series_unverified"
                              elif keys & {"Error Message", "Note", "Information"}:
                                  record["payload_class"] = "vendor_message_not_prices"
                              elif body.get("status") == "error":
                                  record["payload_class"] = "vendor_error_not_prices"
                              else:
                                  record["payload_class"] = "unrecognized_json"
                          elif isinstance(body, list):
                              record["payload_class"] = "json_list_unverified"
                          else:
                              record["payload_class"] = "unexpected_json"
                      except (ValueError, UnicodeDecodeError):
                          record["payload_class"] = "non_json_response"
              except HTTPError as exc:
                  record.update(http_status=exc.code, outcome="http_error")
              except (URLError, TimeoutError, OSError) as exc:
                  record.update(outcome="network_error", error_type=type(exc).__name__)
              results.append(record)
              print(json.dumps(record))
          Path("research-price-probe/provider-access.json").write_text(
              json.dumps(results, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dipsaus-one-shot-price-probe
          path: research-price-probe/
          if-no-files-found: warn
          retention-days: 7
