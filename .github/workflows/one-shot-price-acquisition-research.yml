name: DIPSAUS one-shot public price acquisition experiment

on:
  pull_request:
    paths:
      - '.github/workflows/one-shot-price-acquisition-research.yml'

permissions:
  contents: read

jobs:
  public-price-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe one public Stooq historical series (no credentials)
        shell: bash
        run: |
          mkdir -p research-price-probe
          python - <<'PY'
          import json
          from pathlib import Path
          from research_event_stooq_acquisition import acquire_stooq_history
          outcome = {"source": "stooq", "symbol": "AMD", "start": "2026-10-01",
                     "end": "2026-10-23", "trade_ready": False}
          try:
              metadata = acquire_stooq_history(
                  "AMD", "2026-10-01", "2026-10-23",
                  "research-price-probe", allow_network=True)
              outcome.update(status="downloaded_unverified",
                             observations=metadata["row_count"],
                             sha256=metadata["content_sha256"])
          except Exception as exc:
              outcome.update(status="unavailable", error_type=type(exc).__name__,
                             error=str(exc)[:160])
          Path("research-price-probe/result.json").write_text(
              json.dumps(outcome, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(outcome))
          if outcome["status"] != "downloaded_unverified":
              print("RESEARCH DATA NOT ACQUIRED: workflow job succeeded only as diagnostic")
          PY
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dipsaus-one-shot-price-probe
          path: research-price-probe/
          if-no-files-found: warn
          retention-days: 7
