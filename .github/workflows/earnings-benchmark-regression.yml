name: DIPSAUS offline earnings benchmark regression
on:
  push:
    branches: [research/offline-technical-risk-20261021]
    paths:
      - research_earnings_benchmark_comparison.py
      - test_research_earnings_benchmark_comparison.py
      - research_earnings_robustness_audit.py
      - test_research_exchange_timezone.py
      - .github/workflows/earnings-benchmark-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run deterministic offline benchmark and timezone tests
        run: python -m unittest -v test_research_earnings_benchmark_comparison test_research_exchange_timezone
