name: Research six entry candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Calculate research-only snapshot
        run: python research/candidate_entry_snapshot.py
      - name: Publish research output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-entry-candidate-snapshot
          path: reports/candidate_entry_research.json
          if-no-files-found: warn
