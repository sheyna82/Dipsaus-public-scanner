name: Swing manual price probe mock checks
on:
  pull_request:
    paths:
      - 'research_swing_live_price_probe.py'
      - 'test_research_swing_live_price_probe.py'
      - 'research_swing_public_price_one_shot.py'
      - 'research_swing_price_probe_status.py'
      - '.github/workflows/swing-manual-price-probe-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_research_swing_live_price_probe
