name: AMD SPY prospective research check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'sheyna82/Dipsaus-public-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Capture research observations independently
        run: |
          mkdir -p research-observation
          python research_capture_amd_history.py research-observation/amd-history.json
          python research_capture_spy_history.py research-observation/spy-history.json
      - name: Evaluate only completed current NY trading session
        run: python research_check_amd_spy_prospective.py research-observation/amd-history.json research-observation/spy-history.json research-observation/amd-spy-check.json
      - name: Upload immutable evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dipsaus-amd-spy-prospective-check
          path: research-observation/
          if-no-files-found: error
          retention-days: 30
