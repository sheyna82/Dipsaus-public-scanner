name: US dispatch session gate isolated tests
on:
  push:
    branches:
      - fix/us-dispatch-session-gate-20261110
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install production locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify US dispatch time boundaries
        run: python -m unittest -v test_us_schedule_gate.py
      - name: Run production regression and migration safety suite
        run: python -m unittest discover -p 'test*.py'
