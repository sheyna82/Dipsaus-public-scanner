name: Historical DIPSAUS research replay (no notifications)
on:
  pull_request:
    paths:
      - 'historical_replay.py'
      - '.github/workflows/historical-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements.lock
      - name: Fetch historical OHLCV and replay (research only)
        run: python historical_replay.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: historical-replay-report
          path: historical_replay_report.json
          if-no-files-found: warn
          retention-days: 7
