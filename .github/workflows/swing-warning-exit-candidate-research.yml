name: DIPSAUS warning exit candidate research tests
on:
  pull_request:
    paths:
      - 'research/swing_lifecycle/warning_exit_candidate.py'
      - 'research/swing_lifecycle/test_warning_exit_candidate.py'
      - 'research/swing_lifecycle/warning_portfolio_comparison.py'
      - 'research/swing_lifecycle/test_warning_portfolio_comparison.py'
      - 'research/swing_lifecycle/warning_exit_holdout.py'
      - 'research/swing_lifecycle/test_warning_exit_holdout.py'
      - 'research/swing_lifecycle/synthetic_warning_exit_smoke.py'
      - 'research/swing_lifecycle/test_synthetic_warning_exit_smoke.py'
      - 'research_swing_failure_warning.py'
      - '.github/workflows/swing-warning-exit-candidate-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  warning-exit-candidate-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run offline warning-to-exit regression tests
        run: python -m unittest -v research.swing_lifecycle.test_warning_exit_candidate research.swing_lifecycle.test_warning_portfolio_comparison research.swing_lifecycle.test_warning_exit_holdout research.swing_lifecycle.test_synthetic_warning_exit_smoke test_research_swing_failure_warning
