name: SPY isolated benchmark history
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research_capture_spy_history.py'
      - 'test_research_capture_spy_history.py'
      - '.github/workflows/research-spy-history-isolated.yml'
permissions:
  contents: read
jobs:
  spy-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_research_capture_spy_history.py
  spy-history-capture:
    needs: spy-offline
    if: github.repository == 'sheyna82/Dipsaus-public-scanner' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          mkdir -p research-observation
          python research_capture_spy_history.py research-observation/spy-history.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dipsaus-spy-historical-research
          path: research-observation/spy-history.json
          if-no-files-found: error
          retention-days: 7
