name: DIPSAUS isolated Finnhub evidence verification tests

on:
  push:
    branches:
      - research/prospective-core-isolation-20261103
    paths:
      - research_verify_finnhub_observation.py
      - test_research_verify_finnhub_observation.py
      - .github/workflows/research-finnhub-evidence-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-evidence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify isolated evidence tests (no API credentials)
        run: python -m unittest -v test_research_verify_finnhub_observation
