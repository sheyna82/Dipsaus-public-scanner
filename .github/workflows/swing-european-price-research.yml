name: DIPSAUS Europe isolated price research
on:
  workflow_dispatch:
  push:
    branches:
      - research/offline-technical-risk-20261021
    paths:
      - '.github/workflows/swing-european-price-research.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/swing-european-price-research.yml'
permissions:
  contents: read
jobs:
  european-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run isolated manifest tests
        run: python -m unittest -v test_research_swing_european_universe test_research_swing_european_data_gates
      - name: Retrieve European daily OHLCV research data
        run: |
          python - <<'PY'
          import json,time,urllib.request
          from pathlib import Path
          from research_swing_european_universe import european_manifest,audit_european_coverage
          from research_swing_european_data_gates import validate_daily_rows
          m=european_manifest()
          instruments=m["symbols"]+m["benchmarks"]
          root=Path("europe-price-probe");root.mkdir(exist_ok=True)
          aliases={"SHEL.AS":"SHELL.AS","URW.AS":"URW.PA"}
          statuses={};results=[]
          for instrument in instruments:
              symbol=instrument["symbol"]
              source_symbol=aliases.get(symbol,symbol)
              record=dict(instrument,source="yahoo_chart",source_symbol=source_symbol,source_alias_used=(source_symbol!=symbol),trade_ready=False,independently_verified=False)
              try:
                  url=f"https://query1.finance.yahoo.com/v8/finance/chart/{source_symbol}?range=5y&interval=1d"
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 DIPSAUS-research/1.0"})
                  with urllib.request.urlopen(request,timeout=15) as response: data=json.load(response)
                  item=data["chart"]["result"][0];q=item["indicators"]["quote"][0]
                  raw=list(zip(item["timestamp"],q["open"],q["high"],q["low"],q["close"],q["volume"]))
                  rows=[]
                  for ts,o,h,l,c,v in raw:
                      if None in (ts,o,h,l,c) or not (0<l<=min(o,c)<=max(o,c)<=h):continue
                      rows.append({"timestamp":ts,"open":o,"high":h,"low":l,"close":c,"volume":v})
                  if len(rows)<200:raise ValueError("insufficient_ohlcv")
                  validate_daily_rows(rows)
                  (root/(symbol+".json")).write_text(json.dumps({"instrument":instrument,"rows":rows}))
                  record.update(status="normalized_unverified",corporate_actions_verified=False,calendar_aligned=False,listing_history_review_required=(symbol=="URW.AS"),raw_rows=len(raw),accepted_rows=len(rows),rejected_rows=len(raw)-len(rows),first_timestamp=rows[0]["timestamp"],last_timestamp=rows[-1]["timestamp"])
              except Exception as exc:
                  record.update(status="unavailable",error_type=type(exc).__name__,error=str(exc)[:160])
              statuses[symbol]=record["status"];results.append(record)
              print(json.dumps(record),flush=True)
              time.sleep(0.15)
          coverage=audit_european_coverage(statuses)
          (root/"coverage.json").write_text(json.dumps({"manifest":m,"coverage":coverage,"results":results},indent=2))
          print("EUROPE_COVERAGE",json.dumps(coverage),flush=True)
          if coverage["unavailable"]:raise SystemExit("European research data incomplete; inspect artifact")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dipsaus-europe-prices-unverified
          path: europe-price-probe/
          retention-days: 7
          if-no-files-found: warn
