name: DIPSAUS swing portfolio benchmark research tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research_swing_next_open_execution.py'
      - 'research_swing_chronological_ledger.py'
      - 'test_research_swing_chronological_ledger.py'
      - 'research_swing_portfolio_benchmark.py'
      - 'test_research_swing_portfolio_benchmark.py'
      - '.github/workflows/swing-portfolio-benchmark-research.yml'

permissions:
  contents: read

jobs:
  synthetic-portfolio-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test capital-matched portfolio ranking baseline
        run: python -m unittest -v test_research_swing_portfolio_benchmark test_research_swing_chronological_ledger
