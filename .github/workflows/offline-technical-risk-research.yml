jobs:
  offline-risk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_portfolio_downside_research test_dipsaus_offline_technical_risk test_dipsaus_offline_risk_followthrough test_dipsaus_offline_risk_cohorts test_dipsaus_offline_risk_matching test_dipsaus_offline_asof_audit test_dipsaus_offline_recovery_baseline test_dipsaus_offline_recovery_outcomes test_dipsaus_offline_recovery_score_report test_dipsaus_offline_recovery_pipeline test_dipsaus_offline_recovery_dataset test_dipsaus_offline_recovery_holdout test_dipsaus_offline_recovery_holdout_report test_dipsaus_offline_dataset_manifest test_dipsaus_offline_ohlcv_features test_dipsaus_offline_ohlcv_csv test_dipsaus_offline_csv_pilot test_dipsaus_offline_price_history_eval test_research_reproduce_plotly_aapl test_dipsaus_offline_benchmark_sessions test_dipsaus_offline_adjustment_gate test_dipsaus_offline_adjustment_factor_audit test_dipsaus_offline_downside_metrics test_dipsaus_offline_wiki_subset test_dipsaus_offline_history_quality test_dipsaus_offline_cohort_gate test_dipsaus_offline_multiticker_eval test_dipsaus_offline_multiticker_readiness test_dipsaus_offline_universe_coverage test_dipsaus_offline_earnings_asof_gate test_dipsaus_offline_earnings_coverage_gate test_dipsaus_offline_security_master_gate test_dipsaus_offline_integrated_readiness test_dipsaus_offline_readiness_report test_dipsaus_offline_matched_benchmark test_dipsaus_offline_matched_downside test_dipsaus_offline_return_risk_pairing test_dipsaus_offline_combined_return_risk test_dipsaus_offline_frozen_event_market_bridge test_dipsaus_offline_lookahead_audit test_dipsaus_offline_frozen_rs_atr test_dipsaus_offline_rs_atr_cohorts test_dipsaus_offline_chronological_rs_atr test_research_multisector_source_availability test_dipsaus_offline_event_watch test_dipsaus_offline_event_transition test_dipsaus_offline_event_batch test_dipsaus_offline_event_evidence test_dipsaus_offline_event_daily_evidence test_dipsaus_offline_event_session_gate test_dipsaus_offline_event_history_outcomes test_dipsaus_offline_event_execution_costs test_dipsaus_offline_completed_daily_bar_gate test_dipsaus_offline_event_calendar_phases test_dipsaus_offline_event_chronological_holdout test_dipsaus_offline_event_holdout_risk_summary test_research_exe_intraday_replay test_dipsaus_offline_exe_lead_time_audit test_dipsaus_offline_exe_missing_minutes test_research_exe_historical_lead_time test_dipsaus_offline_exe_isolated_replay test_dipsaus_offline_exe_gate_diagnostics test_dipsaus_offline_exe_drawdown_context test_dipsaus_offline_system_readiness test_dipsaus_offline_workflow_inventory test_dipsaus_offline_notification_funnel

  observed-price-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce observed Apple price pilot (research only)
        run: python research_reproduce_plotly_aapl.py

  independent-spy-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare observed Apple history against independent SPY
        run: python research_reproduce_aapl_spy.py

  adjustment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit public Apple and SPY price adjustments
        run: python research_audit_aapl_spy_adjustments.py

  observed-apple-adjustment-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe real Apple adjusted-close factor changes
        run: python research_observe_apple_adjustment_factors.py

  adjustment-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare raw and consistently adjusted Apple OHLC scenarios
        run: python research_aapl_adjustment_sensitivity.py

  selected-skipped-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare selected and skipped observed Apple signals
        run: python research_aapl_spy_selected_skipped.py

  four-event-ticker-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe four free daily data endpoints (nonblocking research)
        run: |
          python research_probe_four_event_tickers.py
          python research_diagnose_four_ticker_source.py

  alternative-four-ticker-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe alternate daily market data structure (research only)
        run: |
          python research_probe_alternative_daily_source.py
          python research_audit_four_event_ohlcv.py
          python research_four_event_daily_snapshot.py
          python research_four_event_history_results.py

  long-history-four-symbol-research:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Two-year descriptive signal history (research only)
        run: python research_four_event_long_history.py

  exe-minute-source-research:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check EXE minute history availability once (research only)
        run: |
          python research_probe_exe_minute_source.py
          python research_exe_historical_lead_time.py

  multisector-source-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Probe cross-sector historical source coverage (not a backtest)
        run: python research_multisector_source_availability.py

  dis-source-anomaly-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Inspect DIS rejected bars without repairing vendor data
        run: python research_diagnose_dis_history.py

  observed-four-event-spy-risk:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare observed frozen events to SPY return and downside (unverified source)
        run: python research_observed_four_event_spy_risk.py

  observed-four-rs-atr-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe RS ATR cohort return and drawdown (unverified research only)
        run: python research_observed_four_rs_atr_cohorts.py
