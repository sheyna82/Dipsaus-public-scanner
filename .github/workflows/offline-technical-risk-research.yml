name: DIPSAUS offline technical risk research
on:
  pull_request:
    paths:
      - 'dipsaus_offline_technical_risk.py'
      - 'test_dipsaus_offline_technical_risk.py'
      - '.github/workflows/offline-technical-risk-research.yml'
permissions:
  contents: read
jobs:
  offline-risk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_dipsaus_offline_technical_risk
