name: DIPSAUS offline technical risk research
on:
  pull_request:
    paths:
      - 'dipsaus_offline_technical_risk.py'
      - 'test_dipsaus_offline_technical_risk.py'
      - 'dipsaus_offline_risk_followthrough.py'
      - 'test_dipsaus_offline_risk_followthrough.py'
      - 'dipsaus_offline_risk_cohorts.py'
      - 'test_dipsaus_offline_risk_cohorts.py'
      - 'dipsaus_offline_risk_matching.py'
      - 'test_dipsaus_offline_risk_matching.py'
      - 'dipsaus_offline_asof_audit.py'
      - 'test_dipsaus_offline_asof_audit.py'
      - 'dipsaus_offline_recovery_baseline.py'
      - 'test_dipsaus_offline_recovery_baseline.py'
      - 'dipsaus_offline_recovery_outcomes.py'
      - 'test_dipsaus_offline_recovery_outcomes.py'
      - 'dipsaus_offline_recovery_score_report.py'
      - 'test_dipsaus_offline_recovery_score_report.py'
      - 'dipsaus_offline_recovery_pipeline.py'
      - 'test_dipsaus_offline_recovery_pipeline.py'
      - 'dipsaus_offline_recovery_dataset.py'
      - 'test_dipsaus_offline_recovery_dataset.py'
      - 'dipsaus_offline_recovery_holdout.py'
      - 'test_dipsaus_offline_recovery_holdout.py'
      - 'dipsaus_offline_recovery_holdout_report.py'
      - 'test_dipsaus_offline_recovery_holdout_report.py'
      - 'dipsaus_offline_dataset_manifest.py'
      - 'test_dipsaus_offline_dataset_manifest.py'
      - 'dipsaus_offline_ohlcv_features.py'
      - 'test_dipsaus_offline_ohlcv_features.py'
      - 'dipsaus_offline_ohlcv_csv.py'
      - 'test_dipsaus_offline_ohlcv_csv.py'
      - 'dipsaus_offline_csv_pilot.py'
      - 'test_dipsaus_offline_csv_pilot.py'
      - 'dipsaus_offline_price_history_eval.py'
      - 'test_dipsaus_offline_price_history_eval.py'
      - 'research_reproduce_plotly_aapl.py'
      - 'test_research_reproduce_plotly_aapl.py'
      - 'dipsaus_offline_benchmark_sessions.py'
      - 'test_dipsaus_offline_benchmark_sessions.py'
      - 'research_reproduce_aapl_spy.py'
      - 'research_audit_aapl_spy_adjustments.py'
      - 'dipsaus_offline_adjustment_gate.py'
      - 'test_dipsaus_offline_adjustment_gate.py'
      - 'dipsaus_offline_adjustment_factor_audit.py'
      - 'test_dipsaus_offline_adjustment_factor_audit.py'
      - 'research_observe_apple_adjustment_factors.py'
      - 'research_aapl_adjustment_sensitivity.py'
      - 'research_aapl_spy_selected_skipped.py'
      - 'dipsaus_offline_event_evidence.py'
      - 'test_dipsaus_offline_event_evidence.py'
      - 'dipsaus_offline_event_batch.py'
      - 'test_dipsaus_offline_event_batch.py'
      - 'dipsaus_offline_event_transition.py'
      - 'test_dipsaus_offline_event_transition.py'
      - 'dipsaus_offline_event_watch.py'
      - 'test_dipsaus_offline_event_watch.py'
      - 'dipsaus_offline_multiticker_eval.py'
      - 'test_dipsaus_offline_multiticker_eval.py'
      - 'dipsaus_offline_cohort_gate.py'
      - 'test_dipsaus_offline_cohort_gate.py'
      - 'dipsaus_offline_history_quality.py'
      - 'test_dipsaus_offline_history_quality.py'
      - 'dipsaus_offline_wiki_subset.py'
      - 'test_dipsaus_offline_wiki_subset.py'
      - 'dipsaus_offline_downside_metrics.py'
      - 'test_dipsaus_offline_downside_metrics.py'
      - '.github/workflows/offline-technical-risk-research.yml'
permissions:
  contents: read
jobs:
  offline-risk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_dipsaus_offline_technical_risk test_dipsaus_offline_risk_followthrough test_dipsaus_offline_risk_cohorts test_dipsaus_offline_risk_matching test_dipsaus_offline_asof_audit test_dipsaus_offline_recovery_baseline test_dipsaus_offline_recovery_outcomes test_dipsaus_offline_recovery_score_report test_dipsaus_offline_recovery_pipeline test_dipsaus_offline_recovery_dataset test_dipsaus_offline_recovery_holdout test_dipsaus_offline_recovery_holdout_report test_dipsaus_offline_dataset_manifest test_dipsaus_offline_ohlcv_features test_dipsaus_offline_ohlcv_csv test_dipsaus_offline_csv_pilot test_dipsaus_offline_price_history_eval test_research_reproduce_plotly_aapl test_dipsaus_offline_benchmark_sessions test_dipsaus_offline_adjustment_gate test_dipsaus_offline_adjustment_factor_audit test_dipsaus_offline_downside_metrics test_dipsaus_offline_wiki_subset test_dipsaus_offline_history_quality test_dipsaus_offline_cohort_gate test_dipsaus_offline_multiticker_eval test_dipsaus_offline_event_watch test_dipsaus_offline_event_transition test_dipsaus_offline_event_batch test_dipsaus_offline_event_evidence

  observed-price-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce observed Apple price pilot (research only)
        run: python research_reproduce_plotly_aapl.py

  independent-spy-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare observed Apple history against independent SPY
        run: python research_reproduce_aapl_spy.py

  adjustment-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Audit public Apple and SPY price adjustments
        run: python research_audit_aapl_spy_adjustments.py

  observed-apple-adjustment-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe real Apple adjusted-close factor changes
        run: python research_observe_apple_adjustment_factors.py

  adjustment-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare raw and consistently adjusted Apple OHLC scenarios
        run: python research_aapl_adjustment_sensitivity.py

  selected-skipped-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compare selected and skipped observed Apple signals
        run: python research_aapl_spy_selected_skipped.py
