name: DIPSAUS Europe recovery
on:
  workflow_dispatch:
  schedule:
    # UTC covers both CET and CEST; a separate Amsterdam core-hours gate
    # excludes off-session scheduled runs. Five-minute cadence is preserved.
    # Offset avoids the top-of-hour GitHub scheduler peak.
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 6-17 * * 1-5'
permissions:
  contents: read
concurrency:
  group: dipsaus-eu-runtime
  cancel-in-progress: false
jobs:
  scanner:
    if: github.repository == 'sheyna82/Dipsaus-public-scanner' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check European scheduled core hours
        id: eu_schedule_gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python eu_schedule_gate.py
      - name: Install tested pinned dependencies
        if: steps.eu_schedule_gate.outputs.allowed == 'true'
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run regression and migration safety tests
        if: steps.eu_schedule_gate.outputs.allowed == 'true'
        run: python -m unittest discover -p 'test*.py'
      - name: Run scanner with private runtime data
        if: steps.eu_schedule_gate.outputs.allowed == 'true'
        env:
          SCANNER_MANUAL_TRIGGERS: ${{ secrets.SCANNER_MANUAL_TRIGGERS }}
          SCANNER_SUPPLEMENTAL_TRIGGERS: ${{ secrets.SCANNER_SUPPLEMENTAL_TRIGGERS }}
          SCANNER_PORTFOLIO_WATCH: ${{ secrets.SCANNER_PORTFOLIO_WATCH }}
          SCANNER_PROFIT_WATCH: ${{ secrets.SCANNER_PROFIT_WATCH }}
          SCANNER_NOTIFICATION_GATE: ${{ secrets.SCANNER_NOTIFICATION_GATE }}
          SCANNER_STATE_REPOSITORY: ${{ secrets.SCANNER_STATE_REPOSITORY }}
          SCANNER_STATE_TOKEN: ${{ secrets.SCANNER_STATE_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SCANNER_NOTIFICATIONS_ENABLED: 'false'
        run: python safe_runner.py eu
      # No report summaries, artifacts, caches, git commits or personal stdout.
