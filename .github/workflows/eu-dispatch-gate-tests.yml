name: EU dispatch session gate isolated tests
on:
  push:
    branches:
      - fix/eu-dispatch-session-gate-20261110
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify dispatch and schedule are both session gated
        run: python -m unittest -v test_eu_schedule_gate.py
