      - 'test_research_source_snapshot_binding.py'
      - 'test_research_real_observation_archive_integration.py'
      - 'test_research_observation_temporal_integrity.py'
      - 'research_real_observation_registration_bridge.py'
      - 'test_research_real_observation_registration_bridge.py'
      - 'research_prospective_real_candidate_intake.py'
      - 'test_research_prospective_real_candidate_intake.py'
      - 'research_verify_downloaded_github_artifact.py'
      - 'test_research_verify_downloaded_github_artifact.py'
      - 'research_github_synthetic_artifact_verifier.py'
      - 'test_research_github_synthetic_artifact_verifier.py'
      - 'research_synthetic_transport_verifier.py'
      - 'test_research_synthetic_transport_verifier.py'
