      - 'research_candidate_artifact_content_binding.py'
      - 'test_research_candidate_receipt_archive_integration.py'
      - 'test_research_candidate_artifact_content_binding.py'
      - 'research_preserved_observation_report.py'
      - 'test_research_real_amd_csgp_evidence.py'
      - 'test_research_preserved_observation_report.py'
      - 'research_verify_preserved_observation.py'
      - 'test_research_verify_preserved_observation.py'
      - 'research-evidence/**'
      - 'research_export_finnhub_collection.py'
