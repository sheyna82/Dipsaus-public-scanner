name: DIPSAUS isolated prospective research tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research_generate_synthetic_evidence.py'
      - 'research_prospective_archive.py'
      - 'research_prospective_artifact_download.py'
      - 'test_research_actual_downloader_integration.py'
      - 'test_research_inventory_download_integration.py'
      - 'test_research_synthetic_evidence_pair.py'
      - 'research_next_open_reference.py'
      - 'test_research_next_open_reference.py'
      - 'research_capture_candidate_boundary.py'
      - 'test_research_capture_candidate_boundary.py'
      - 'research_prospective_outcome_writer.py'
      - 'test_research_prospective_outcome_writer.py'
      - 'research_prospective_core_integration.py'
      - 'test_research_prospective_core_integration.py'
      - 'research_immutable_candidate_registration.py'
      - 'test_research_immutable_candidate_registration.py'
      - 'research_candidate_registration_reconciliation.py'
      - 'test_research_candidate_registration_reconciliation.py'
      - 'research_registration_artifact_coverage.py'
      - 'test_research_registration_artifact_coverage.py'
      - 'research_registration_artifact_inventory.py'
      - 'test_research_registration_artifact_inventory.py'
      - 'research_registration_archive_bridge.py'
      - 'test_research_registration_archive_bridge.py'
      - 'test_research_registration_multirun_integration.py'
      - 'test_research_registration_transport_integration.py'
      - '.github/workflows/prospective-core-isolated-tests.yml'

permissions:
  contents: read

jobs:
  isolated-prospective-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run all isolated research regression tests
        run: python -m unittest -v test_research_next_open_reference test_research_capture_candidate_boundary test_research_prospective_outcome_writer test_research_prospective_core_integration test_research_immutable_candidate_registration test_research_candidate_registration_reconciliation test_research_registration_artifact_coverage test_research_registration_artifact_inventory test_research_registration_archive_bridge test_research_registration_multirun_integration test_research_registration_transport_integration test_research_actual_downloader_integration test_research_inventory_download_integration test_research_synthetic_evidence_pair
      - name: Generate synthetic evidence archive
        run: python research_generate_synthetic_evidence.py
      - name: Upload synthetic research evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dipsaus-prospective-synthetic-evidence
          path: |
            synthetic-evidence/prospective-ledger-synthetic.zip
            synthetic-evidence/sha256.txt
          if-no-files-found: error
          retention-days: 7
