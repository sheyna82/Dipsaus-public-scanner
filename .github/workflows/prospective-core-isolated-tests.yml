      - 'test_research_finnhub_schedule_policy.py'
      - 'research_verify_finnhub_observation.py'
      - 'test_research_verify_finnhub_observation.py'
      - 'research_capture_finnhub_observation.py'
      - 'test_research_capture_finnhub_observation.py'
      - 'research_downloaded_candidate_binding.py'
      - 'test_research_downloaded_candidate_binding.py'
      - 'research_real_candidate_artifact_verifier.py'
      - 'test_research_real_candidate_artifact_verifier.py'
      - 'research_registration_receipt_gate.py'
      - 'test_research_registration_receipt_gate.py'
      - 'research_synthetic_artifact_provenance.py'
      - 'test_research_synthetic_artifact_provenance.py'
      - 'research_next_open_reference.py'
      - 'test_research_next_open_reference.py'
