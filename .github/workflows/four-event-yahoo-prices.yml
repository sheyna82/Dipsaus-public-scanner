name: DIPSAUS four-event public price acquisition
on:
  workflow_dispatch:
  push:
    branches:
      - research/offline-technical-risk-20261021
    paths:
      - '.github/workflows/four-event-yahoo-prices.yml'
permissions:
  contents: read
jobs:
  public-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Acquire public daily historical prices
        run: |
          python - <<'PY'
          import json, hashlib, urllib.request, urllib.parse
          from datetime import datetime, timezone
          from pathlib import Path
          from research_yahoo_chart_daily import parse_yahoo_chart_daily
          from research_event_replay_intake_202610 import CASES
          root = Path("four-event-public-prices")
          root.mkdir(exist_ok=True)
          report = []
          for case in CASES:
              symbol = case["ticker"]
              record = {"symbol": symbol, "source": "yahoo_chart", "verified": False,
                        "signal_time_verified": False, "trade_ready": False}
              try:
                  url = "https://query1.finance.yahoo.com/v8/finance/chart/" + urllib.parse.quote(symbol) + "?range=6mo&interval=1d"
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=15) as response:
                      raw = response.read(2000001)
                  if len(raw) > 2000000:
                      raise ValueError("oversized_vendor_response")
                  rows = parse_yahoo_chart_daily(json.loads(raw), expected_symbol=symbol)
                  alert = case["alert_date"]
                  before = [row for row in rows if row["date"] <= alert]
                  after = [row for row in rows if row["date"] > alert]
                  payload = {"symbol": symbol, "source": "yahoo_chart",
                             "retrieved_at_utc": datetime.now(timezone.utc).isoformat(),
                             "raw_sha256": hashlib.sha256(raw).hexdigest(),
                             "unverified_vendor_data": True,
                             "alert_date_reconstructed": alert,
                             "daily_close_not_execution_price": True, "rows": rows}
                  (root / (symbol + ".json")).write_text(json.dumps(payload, indent=2))
                  record.update(status="downloaded_unverified", row_count=len(rows),
                                before_or_on_alert=len(before), after_alert=len(after),
                                latest_date=rows[-1]["date"])
              except Exception as exc:
                  record.update(status="unavailable", error_type=type(exc).__name__)
              report.append(record)
              print(json.dumps(record), flush=True)
          (root / "coverage.json").write_text(json.dumps(report, indent=2))
          if any(r["status"] != "downloaded_unverified" for r in report):
              raise SystemExit("Incomplete vendor price coverage; see coverage artifact")
          PY
      - name: Upload research-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dipsaus-four-event-public-prices-unverified
          path: four-event-public-prices/
          retention-days: 7
          if-no-files-found: warn
