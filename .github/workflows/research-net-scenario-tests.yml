name: Research net scenario offline tests

on:
  push:
    branches:
      - research/net-execution-math-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated offline net scenario tests
        run: python -m unittest -v test_research_net_scenario test_us_code_freeze test_research_net_bridge test_research_net_attestation test_research_source_policy test_research_evidence_manifest test_research_instrument_gate test_research_instrument_corroboration test_research_iso_mic_parser test_research_mic_crosswalk test_research_official_source_snapshot test_research_mic_import test_research_xetra_snapshot test_research_iso_official_snapshot test_research_iso_replay test_research_eu_crosswalk test_research_degiro_evidence test_research_degiro_net_bridge test_research_fee_evidence_hierarchy test_research_sell_fee_sensitivity test_research_candidate_ranking test_research_liquidity_earnings_risk test_research_candidate_review test_research_walk_forward_validation test_research_historical_coverage test_research_historical_event_contract test_research_synthetic_history_pipeline test_research_history_readiness test_research_batch_manifest test_research_batch_fingerprint test_research_attestation_chain test_research_attestation_trust_policy
