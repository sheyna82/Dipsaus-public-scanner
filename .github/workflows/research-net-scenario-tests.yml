name: Research net scenario offline tests

on:
  push:
    branches:
      - research/net-execution-math-20261119
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated offline net scenario tests
        run: python -m unittest -v test_research_net_scenario test_us_code_freeze test_research_net_bridge test_research_net_attestation test_research_source_policy
