name: DIPSAUS research static security checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research_atr_incremental_holdout_scoring.py'
      - 'research/test_atr_hypothesis_research.py'
      - '.github/workflows/atr-static-checks-research.yml'

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded analysis dependencies
        run: python -m pip install 'bandit>=1.7,<2' 'ruff>=0.9,<1'
      - name: Bandit report-only
        run: |
          # Keep assert checks enabled for model code; B101 in pytest is expected.
          python -m bandit -q -f txt research_atr_incremental_holdout_scoring.py || true
          python -m bandit -q -s B101 -f txt research/test_atr_hypothesis_research.py || true
      - name: Ruff report-only
        run: |
          ruff check --output-format concise research_atr_incremental_holdout_scoring.py research/test_atr_hypothesis_research.py || true
          echo '--- Ruff exact import fix preview (no files modified) ---'
          ruff check --select I001 --fix --diff research/test_atr_hypothesis_research.py || true
