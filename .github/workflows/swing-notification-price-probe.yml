name: DIPSAUS notification historical price probe
on:
  push:
    branches:
      - research/offline-technical-risk-20261021
    paths:
      - '.github/workflows/swing-notification-price-probe.yml'
      - 'research_notification_coverage_audit.py'
      - 'test_research_notification_coverage_audit.py'
      - 'research_notification_pre_signal_metrics.py'
      - 'test_research_notification_pre_signal_metrics.py'
      - 'research_notification_signal_stage.py'
      - 'test_research_notification_signal_stage.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/swing-notification-price-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify notification research modules
        run: python -m unittest -v test_research_notification_signal_cases test_research_notification_forward_returns test_research_notification_relative_performance test_research_notification_coverage_audit test_research_notification_pre_signal_metrics test_research_notification_signal_stage
      - name: Acquire historical price observations without execution claims
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, time
          from pathlib import Path
          from research_notification_signal_cases import CASES_2026_10_26
          root=Path("notification-price-probe");root.mkdir(exist_ok=True)
          results=[]
          for case in CASES_2026_10_26:
              symbol=case.symbol
              record={"symbol":symbol,"family":case.family,"research_only":True,"trade_ready":False,"execution_verified":False,"signal_timestamp_verified":False,"source":"yahoo_chart"}
              try:
                  url="https://query1.finance.yahoo.com/v8/finance/chart/"+urllib.parse.quote(symbol,safe="") + "?range=3mo&interval=1d"
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 DIPSAUS-research/1.0"})
                  with urllib.request.urlopen(req,timeout=15) as response: data=json.load(response)
                  item=data["chart"]["result"][0];q=item["indicators"]["quote"][0]
                  bars=[]
                  for ts,o,h,l,c,v in zip(item["timestamp"],q["open"],q["high"],q["low"],q["close"],q["volume"]):
                      if None in (ts,o,h,l,c) or not 0<l<=min(o,c)<=max(o,c)<=h:continue
                      bars.append({"timestamp":ts,"open":o,"high":h,"low":l,"close":c,"volume":v})
                  if len(bars)<10:raise ValueError("insufficient_daily_bars")
                  (root/(symbol+".json")).write_text(json.dumps({"symbol":symbol,"bars":bars,"unverified":True}))
                  record.update(status="downloaded_unverified",rows=len(bars),last_timestamp=bars[-1]["timestamp"])
              except Exception as exc:
                  record.update(status="unavailable",error_type=type(exc).__name__,error=str(exc)[:120])
              results.append(record);print(json.dumps(record),flush=True);time.sleep(0.2)
          (root/"coverage.json").write_text(json.dumps(results,indent=2))
          from research_notification_coverage_audit import audit_coverage
          payloads={}
          for case in CASES_2026_10_26:
              file=root/(case.symbol+".json")
              if file.exists():
                  payloads[case.symbol]=json.loads(file.read_text())
          audit=audit_coverage(CASES_2026_10_26,payloads)
          (root/"coverage-audit.json").write_text(json.dumps(audit,indent=2))
          from research_notification_pre_signal_metrics import pre_signal_metrics
          metrics=[]
          for case in CASES_2026_10_26:
              payload=payloads.get(case.symbol)
              item={"symbol":case.symbol,"family":case.family,"research_only":True}
              if payload:
                  item.update(pre_signal_metrics("2026-10-26",payload["bars"]))
              else:
                  item.update(status="missing_price_file")
              metrics.append(item)
          (root/"pre-signal-metrics.json").write_text(json.dumps(metrics,indent=2))
          from research_notification_signal_stage import classify_stage
          stages=[]
          for metric in metrics:
              stages.append({"symbol":metric["symbol"],"family":metric["family"],**classify_stage(metric)})
          (root/"signal-stage-hypotheses.json").write_text(json.dumps(stages,indent=2))
          print("NOTIFICATION_SIGNAL_STAGE_HYPOTHESES",json.dumps(stages),flush=True)
          print("NOTIFICATION_PRE_SIGNAL_METRICS",json.dumps(metrics),flush=True)
          print("NOTIFICATION_COVERAGE_AUDIT",json.dumps(audit),flush=True)
          missing=[r["symbol"] for r in results if r["status"]!="downloaded_unverified"]
          print("NOTIFICATION_PRICE_COVERAGE",json.dumps({"available":len(results)-len(missing),"missing":missing}),flush=True)
          if missing:raise SystemExit("Price data incomplete; inspect artifact")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dipsaus-notification-prices-unverified
          path: notification-price-probe/
          retention-days: 7
          if-no-files-found: warn
