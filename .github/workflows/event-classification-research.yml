name: DIPSAUS event classification research tests
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research_swing_event_classification.py'
      - 'test_research_swing_event_classification.py'
      - 'research_swing_event_downside.py'
      - 'test_research_swing_event_downside.py'
      - 'research_swing_event_dataset_audit.py'
      - 'test_research_swing_event_dataset_audit.py'
      - 'research_swing_user_event_examples.py'
      - 'test_research_swing_user_event_examples.py'
      - 'research_swing_event_session_alignment.py'
      - 'test_research_swing_event_session_alignment.py'
      - 'research_swing_event_outcome_study.py'
      - 'test_research_swing_event_outcome_study.py'
      - 'research_swing_event_cohort_summary.py'
      - 'test_research_swing_event_cohort_summary.py'
      - 'research_swing_historical_event_inputs.py'
      - 'test_research_swing_historical_event_inputs.py'
      - 'research_swing_breadth_audit.py'
      - 'test_research_swing_breadth_audit.py'
      - 'research_swing_event_walkforward_split.py'
      - 'test_research_swing_event_walkforward_split.py'
      - 'research_swing_historical_source_registry.py'
      - 'test_research_swing_historical_source_registry.py'
      - 'research_swing_sec_submissions.py'
      - 'test_research_swing_sec_submissions.py'
      - 'research_swing_sec_acceptance_reconciliation.py'
      - 'test_research_swing_sec_acceptance_reconciliation.py'
      - 'research_swing_crossmarket_scorecard.py'
      - 'test_research_swing_crossmarket_scorecard.py'
      - 'research_swing_dataset_manifest.py'
      - 'test_research_swing_dataset_manifest.py'
      - 'research_swing_sec_batch_import.py'
      - 'test_research_swing_sec_batch_import.py'
      - 'research_swing_sec_acquisition.py'
      - 'test_research_swing_sec_acquisition.py'
      - 'research_swing_verified_event_runner.py'
      - 'test_research_swing_verified_event_runner.py'
      - 'research_swing_event_price_csv_bridge.py'
      - 'test_research_swing_event_price_csv_bridge.py'
      - 'research_swing_price_only_recovery_benchmark.py'
      - 'test_research_swing_price_only_recovery_benchmark.py'
      - '.github/workflows/event-classification-research.yml'
permissions:
  contents: read
jobs:
  event-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate offline event classification
        run: python -m unittest -v test_research_swing_event_classification test_research_swing_event_downside test_research_swing_event_dataset_audit test_research_swing_user_event_examples test_research_swing_event_session_alignment test_research_swing_event_outcome_study test_research_swing_event_cohort_summary test_research_swing_historical_event_inputs test_research_swing_breadth_audit test_research_swing_event_walkforward_split test_research_swing_historical_source_registry test_research_swing_sec_submissions test_research_swing_sec_acceptance_reconciliation test_research_swing_crossmarket_scorecard test_research_swing_dataset_manifest test_research_swing_sec_batch_import test_research_swing_sec_acquisition test_research_swing_verified_event_runner test_research_swing_event_price_csv_bridge test_research_swing_price_only_recovery_benchmark
