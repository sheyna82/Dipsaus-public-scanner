name: DIPSAUS prospective swing protocol draft tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/prospective_swing_protocol_v0_draft.json'
      - 'research_validate_swing_draft.py'
      - 'test_research_validate_swing_draft.py'
      - '.github/workflows/prospective-swing-draft-research.yml'

permissions:
  contents: read

jobs:
  inactive-protocol-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate prospective swing protocol draft
        run: python -m unittest -v test_research_validate_swing_draft
