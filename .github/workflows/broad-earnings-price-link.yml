name: DIPSAUS earnings historical price linkage research
on:
  workflow_dispatch:
  push:
    branches: [research/offline-technical-risk-20261021]
    paths:
      - research_broad_earnings_price_link.py
      - .github/workflows/broad-earnings-price-link.yml
permissions:
  contents: read
  actions: read
jobs:
  link:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Download exact historical artifact from prior successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import io, os, urllib.request, zipfile
          url="https://api.github.com/repos/sheyna82/Dipsaus-public-scanner/actions/artifacts/12763431282/zip"
          req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json","User-Agent":"DIPSAUS-research"})
          with urllib.request.urlopen(req,timeout=40) as response: raw=response.read(5000000)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names=z.namelist()
              if len(names)!=14 or any("/" in n or ".." in n for n in names):raise ValueError("unexpected_artifact_members")
              os.mkdir("earnings-source")
              z.extractall("earnings-source")
          PY
      - name: Link first 40 symbols to historical daily OHLCV
        run: python research_broad_earnings_price_link.py --events-dir earnings-source --output-dir earnings-price-link --max-symbols 40
      - name: Upload research outputs and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dipsaus-earnings-price-link-unverified
          path: earnings-price-link/
          retention-days: 7
