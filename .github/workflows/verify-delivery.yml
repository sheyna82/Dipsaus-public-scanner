name: Verify notification delivery once
on:
  push:
    paths: ['.github/workflows/verify-delivery.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'sheyna82/Dipsaus-public-scanner' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Send one deduplicated technical handover message
        env:
          SCANNER_STATE_REPOSITORY: ${{ secrets.SCANNER_STATE_REPOSITORY }}
          SCANNER_STATE_TOKEN: ${{ secrets.SCANNER_STATE_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          from private_runtime import PrivateStore
          from private_notifications import reserve_send
          store = PrivateStore('prealert')
          store.require_exclusive_sender()
          state = store.load()
          key = 'MIGRATION|DELIVERY-TEST|2026-10-09'
          if key in state['signals']:
              assert state['signals'][key].get('delivery') == 'sent', 'Delivery already reserved; do not repeat.'
          else:
              reserve_send(store, state, key, {'kind': 'technical-handover-test'}, 'SYSTEEM', 'DIPSAUS: de openbare scanner heeft de bewaking overgenomen. Dit is een eenmalige technische testmelding, geen handelssignaal.')
          print('Technical notification accepted by delivery service; no old trading alert repeated.')
          PY
