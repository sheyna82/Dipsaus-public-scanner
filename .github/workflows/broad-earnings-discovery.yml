name: Broad historical earnings event discovery (research only)
on:
  workflow_dispatch:
  push:
    branches: [research/offline-technical-risk-20261021]
    paths: [.github/workflows/broad-earnings-discovery.yml]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Collect reported US earnings dates from historical filing index
        run: |
          python - <<'PY'
          import csv,io,json,time,urllib.request,urllib.parse
          from pathlib import Path
          root=Path("broad-earnings-discovery");root.mkdir(exist_ok=True)
          rows=[];errors=[]
          # Past six months per documented no-key endpoint. Quarterly windows avoid truncation.
          for start,end in [('2026-04-01','2026-06-30'),('2026-07-01','2026-09-30'),('2026-10-01','2026-10-27')]:
              q=urllib.parse.urlencode({'from':start,'to':end,'status':'reported','limit':2000})
              url='https://xoomar.com/api/markets/earnings?'+q
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'DipsausResearch/1.0 (public event study)'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read(3000000)
                  data=json.loads(body)
                  (root/f"source_{start}.json").write_bytes(body)
                  rows.append({'start':start,'end':end,'type':type(data).__name__,'size':len(data) if hasattr(data,'__len__') else None,'source':url,'status':'downloaded_unverified'})
              except Exception as e:
                  errors.append({'start':start,'error_type':type(e).__name__})
              time.sleep(2)
          (root/'coverage.json').write_text(json.dumps({'windows':rows,'errors':errors,'no_verified_signal_timestamps':True,'trade_ready':False},indent=2))
          print(json.dumps({'windows':rows,'errors':errors}))
          if not rows: raise SystemExit('No event history downloaded')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dipsaus-broad-reported-earnings-unverified
          path: broad-earnings-discovery/
          retention-days: 7
