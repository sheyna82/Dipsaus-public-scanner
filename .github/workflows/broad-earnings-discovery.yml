name: Broad historical earnings event discovery (research only)
on:
  workflow_dispatch:
  push:
    branches: [research/offline-technical-risk-20261021]
    paths: [.github/workflows/broad-earnings-discovery.yml]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Collect reported US earnings dates from historical filing index
        run: |
          python - <<'PY'
          import json,time,urllib.request,urllib.parse,hashlib
          from pathlib import Path
          root=Path("broad-earnings-discovery");root.mkdir(exist_ok=True)
          rows=[];errors=[];total=0
          # Past six months per documented no-key endpoint. Quarterly windows avoid truncation.
          for start,end in [('2026-05-01','2026-05-15'),('2026-05-16','2026-05-31'),('2026-06-01','2026-06-15'),('2026-06-16','2026-06-30'),('2026-07-01','2026-07-15'),('2026-07-16','2026-07-31'),('2026-08-01','2026-08-15'),('2026-08-16','2026-08-31'),('2026-09-01','2026-09-15'),('2026-09-16','2026-09-30'),('2026-10-01','2026-10-15'),('2026-10-16','2026-10-27')]:
              q=urllib.parse.urlencode({'from':start,'to':end,'status':'reported','limit':2000})
              url='https://xoomar.com/api/markets/earnings?'+q
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'DipsausResearch/1.0 (public event study)'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read(3000000)
                  data=json.loads(body)
                  payload=data.get('data',data) if isinstance(data,dict) else data
                  releases=payload if isinstance(payload,list) else payload.get('releases',[]) if isinstance(payload,dict) else []
                  if not isinstance(releases,list): raise ValueError('unexpected_releases_shape')
                  valid=[x for x in releases if isinstance(x,dict) and x.get('status')=='reported'
                         and isinstance(x.get('date'),str) and start<=x['date']<=end
                         and x.get('ticker') and x.get('accessionNo')]
                  if not valid:
                      diagnostic={'top_level_keys':list(data)[:20] if isinstance(data,dict) else [],
                                  'payload_type':type(payload).__name__,
                                  'payload_keys':list(payload)[:20] if isinstance(payload,dict) else [],
                                  'releases_count':len(releases),
                                  'first_release_keys':list(releases[0])[:20] if releases and isinstance(releases[0],dict) else [],
                                  'response_sha256':hashlib.sha256(body).hexdigest()}
                      (root/f"diagnostic_{start}.json").write_text(json.dumps(diagnostic,indent=2))
                      raise ValueError('no_confirmed_reported_earnings')
                  if len(releases)>=2000: raise ValueError('possible_truncation_split_window')
                  total+=len(valid)
                  (root/f"source_{start}.json").write_bytes(body)
                  rows.append({'start':start,'end':end,'returned':len(releases),'valid':len(valid),
                               'raw_sha256':hashlib.sha256(body).hexdigest(),
                               'source':url,'status':'downloaded_unverified'})
              except Exception as e:
                  errors.append({'start':start,'error_type':type(e).__name__,
                                 'reason':str(e)[:100]})
              time.sleep(2)
          (root/'coverage.json').write_text(json.dumps({'windows':rows,'errors':errors,'valid_records':total,'no_verified_signal_timestamps':True,'trade_ready':False},indent=2))
          print(json.dumps({'windows':rows,'errors':errors}))
          if errors or len(rows)!=12 or total==0: raise SystemExit('Incomplete confirmed earnings coverage; inspect artifact')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dipsaus-broad-reported-earnings-unverified
          path: broad-earnings-discovery/
          retention-days: 7
