name: Nasdaq official index document research capture
on:
  push:
    branches: [research/integrated-evidence-20261106]
    paths:
      - .github/workflows/research-nasdaq-document-capture.yml
      - research_capture_official_index_document.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-document-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Capture official Nasdaq index versions document, research only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research_capture_official_index_document import capture_official_document
          url="https://indexes.nasdaqomx.com/docs/Index_Versions_OMXH25.pdf"
          receipt=capture_official_document(url)
          Path("official-index-observation.json").write_text(json.dumps(receipt,sort_keys=True,indent=2))
          print("official document SHA256:",receipt["official_document_sha256"])
          print("research_only:",receipt["research_only"],"independently_audited:",receipt["independently_audited"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nasdaq-official-document-unverified-observation
          path: official-index-observation.json
          retention-days: 30
