name: DIPSAUS scanner signal chain provenance tests
on:
  pull_request:
    paths:
      - 'research_scanner_signal_chain_provenance_gate.py'
      - 'test_research_scanner_signal_chain_provenance_gate.py'
      - 'research_scanner_observed_case_provenance_audit.py'
      - 'test_research_scanner_observed_case_provenance_audit.py'
      - 'research_notification_signal_cases.py'
      - 'research_scanner_private_notification_match.py'
      - 'test_research_scanner_private_notification_match.py'
      - 'research_notification_timestamp_extract.py'
      - '.github/workflows/scanner-signal-chain-provenance-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run provenance unit tests
        run: python -m unittest -v test_research_scanner_signal_chain_provenance_gate test_research_scanner_observed_case_provenance_audit test_research_scanner_private_notification_match
