name: Swing historical price batch tests
on:
  pull_request:
    paths:
      - 'research_swing_price_batch_manifest.py'
      - 'test_research_swing_price_batch_manifest.py'
      - 'research_swing_ohlcv_csv_ingest.py'
      - 'research_swing_ohlcv_data_audit.py'
      - '.github/workflows/swing-price-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m unittest -v test_research_swing_price_batch_manifest
