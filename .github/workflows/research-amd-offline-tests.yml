name: AMD capture offline contract checks
on:
  pull_request:
    paths:
      - 'research_capture_amd_history.py'
      - 'test_research_capture_amd_history.py'
      - '.github/workflows/research-amd-offline-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  amd-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Offline contract tests (no market requests)
        run: python -m unittest -v test_research_capture_amd_history.py
