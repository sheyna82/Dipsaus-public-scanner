name: DIPSAUS exit cohort validation research tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research_swing_exit_cohort_validation.py'
      - 'test_research_swing_exit_cohort_validation.py'
      - '.github/workflows/swing-exit-cohort-research.yml'

permissions:
  contents: read

jobs:
  synthetic-exit-cohorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test dated cohort and overlap accounting
        run: python -m unittest -v test_research_swing_exit_cohort_validation
